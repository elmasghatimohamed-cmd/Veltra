spring:
  application:
    name: Veltra

  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:veltra_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true